  <text x="515" y="246" font-family="sans-serif" font-size="11" font-weight="700" fill="#1DB954">845 days</text>

  <!-- 6. Harry Styles -->
  <text x="160" y="280" text-anchor="end" font-family="sans-serif" font-size="12" font-weight="600" fill="#ECEFF4">Harry Styles</text>
