<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="850" height="480">
  <rect width="100%" height="100%" fill="#121212" rx="10"/>
  <text x="30" y="42" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Top 10 Dominant Artists in the UK Top 50 (2024–2025)</text>
  <text x="30" y="66" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" fill="#A0A0A0">Measured by Cumulative Days on Chart (Spotify UK Top 50 Snapshots)</text>

  <!-- Legend -->
  <rect x="580" y="32" width="12" height="12" fill="#1DB954" rx="3"/>
  <text x="600" y="42" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" fill="#FFFFFF">UK Domestic Artist</text>
  <rect x="715" y="32" width="12" height="12" fill="#F59E0B" rx="3"/>
  <text x="735" y="42" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" fill="#FFFFFF">International</text>

  <!-- Y-Axis Gridlines & Bars -->
  <!-- 1. Taylor Swift -->
  <text x="160" y="105" text-anchor="end" font-family="sans-serif" font-size="12" font-weight="600" fill="#ECEFF4">Taylor Swift</text>
  <rect x="175" y="90" width="560" height="22" fill="#F59E0B" rx="4"/>
  <text x="742" y="106" font-family="sans-serif" font-size="11" font-weight="700" fill="#F59E0B">1,420 days</text>

  <!-- 2. Arctic Monkeys -->
